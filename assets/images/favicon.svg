<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="16" fill="#0E0D0C"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#E09F3E" stroke-width="2" stroke-opacity="0.85"/>
  <!-- 35mm Film Reels -->
  <circle cx="21" cy="24" r="10" fill="#F7F4EE"/>
  <circle cx="36" cy="21" r="12" fill="#F7F4EE"/>
  <!-- Reel holes -->
  <circle cx="21" cy="24" r="6" fill="#0E0D0C"/>
  <circle cx="36" cy="21" r="7" fill="#0E0D0C"/>
  <circle cx="21" cy="20" r="1.5" fill="#F7F4EE"/>
  <circle cx="24" cy="23" r="1.5" fill="#F7F4EE"/>
  <circle cx="23" cy="27" r="1.5" fill="#F7F4EE"/>
  <circle cx="19" cy="27" r="1.5" fill="#F7F4EE"/>
  <circle cx="18" cy="23" r="1.5" fill="#F7F4EE"/>
  
  <circle cx="36" cy="16" r="1.8" fill="#F7F4EE"/>
  <circle cx="40" cy="19" r="1.8" fill="#F7F4EE"/>
  <circle cx="39" cy="24" r="1.8" fill="#F7F4EE"/>
  <circle cx="33" cy="24" r="1.8" fill="#F7F4EE"/>
  <circle cx="32" cy="19" r="1.8" fill="#F7F4EE"/>

  <!-- Eyepiece Notch -->
  <polygon points="14,33 19,30 19,36" fill="#F7F4EE"/>

  <!-- Camera Body -->
  <rect x="19" y="30" width="27" height="18" fill="#F7F4EE" rx="1"/>

  <!-- Lens Cone / Matte Box -->
  <polygon points="46,31 54,27 54,43 46,39" fill="#F7F4EE"/>

  <!-- pa + P Cutout in Negative Space -->
  <!-- Vertical stem -->
  <rect x="29" y="33" width="2.8" height="13" fill="#0E0D0C"/>
  <!-- Top bar shirorekha -->
  <rect x="23.5" y="33" width="13" height="1.8" fill="#0E0D0C"/>
  <!-- 'pa' left loop -->
  <path d="M 25.5 34.5 C 25.5 39, 29 39.5, 29 39.5" fill="none" stroke="#0E0D0C" stroke-width="2" stroke-linecap="round"/>
  <!-- 'P' right bowl -->
  <path d="M 31 34.5 C 36 34.5, 36 39.5, 31 39.5" fill="none" stroke="#0E0D0C" stroke-width="2"/>
  
  <!-- Indicator rivet -->
  <circle cx="42.5" cy="44.5" r="1" fill="#E09F3E"/>

  <!-- Hand Crank -->
  <polyline points="23,48 23,53 17,54.5" fill="none" stroke="#F7F4EE" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="12" y="53.5" width="5.5" height="2.5" fill="#F7F4EE" transform="rotate(-15 14 54)"/>
</svg>
